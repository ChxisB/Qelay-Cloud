apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qelay.fullname" . }}
  labels:
    {{- include "qelay.labels" (dict "root" . "component" "serviceaccount") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.ingest.enabled }}
---
# The ingest is the only public component: it gets no annotation (no workload identity, so no cloud role) and no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qelay.fullname" . }}-ingest
  labels:
    {{- include "qelay.labels" (dict "root" . "component" "ingest") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
