name: Release

# Push a tag `vX.Y.Z` (or `vX.Y.Z-rc.1`) from main. The full CI runs, then two multi-arch images and the Helm chart are
# published to ghcr.io under the repository owner, and a GitHub Release is created:
#
#   ghcr.io/<owner>/qelay-api:X.Y.Z    ghcr.io/<owner>/qelay-panel:X.Y.Z    oci://ghcr.io/<owner>/charts/qelay (version X.Y.Z)
#
# Only GITHUB_TOKEN is used. The first push of each package is private: set it to public once in the package settings.
# The npm packages are not published here (docs/release-checklist.md).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  guard:
    name: Tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ci:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml

  images:
    name: Image ${{ matrix.name }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: packages/control-api/Dockerfile
          - name: panel
            dockerfile: packages/panel/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: X.Y.Z, X.Y (not for a pre-release) and latest (not for a pre-release). Labels carry the repository, which links the package to it.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/qelay-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  chart:
    name: Helm chart and GitHub Release
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Package and push the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm lint charts/qelay -f charts/qelay/ci/values.yaml
          helm package charts/qelay --version "$VERSION" --app-version "$VERSION" --destination dist
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist/qelay-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          FLAGS=()
          case "$VERSION" in *-*) FLAGS+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/qelay-$VERSION.tgz" "${FLAGS[@]}" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Install: \`helm install qelay oci://ghcr.io/$OWNER/charts/qelay --version $VERSION -f values.yaml\` ([guide](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/quickstart-kubernetes.md)). Images: \`ghcr.io/$OWNER/qelay-api:$VERSION\`, \`ghcr.io/$OWNER/qelay-panel:$VERSION\`."
