components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An OIDC access token (RS256 or ES256) whose issuer, audience and signature the service checks against the issuer's
        JWKS, or, outside production only, the static development token. A role claim (default `roles`) grants `viewer`
        (reads) or `operator` (reads and every route that changes something).
  headers:
    RequestId:
      description: Echo of a valid `X-Request-Id`, or one the service made.
      schema: { type: string }
  parameters:
    Queue:
      name: queue
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    JobId:
      name: id
      in: path
      required: true
      description: The job's id, which is its custom id when it has one.
      schema: { type: string, minLength: 1 }
    CustomId:
      name: customId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ExpectedVersionQuery:
      name: expectedVersion
      in: query
      description: The `version` the caller read. A job that has moved on is 409 `version_conflict`.
      schema: { type: integer, minimum: 0 }
    WebhookId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    CronName:
      name: name
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    EventTypes:
      name: types
      in: query
      description: 'Comma-separated event types to keep, with or without the `job:` prefix: pushed, duplicated, updated, promoted, priority, removed, pulled, released, completed, retried, stalled, failed, progress, obliterated. Default every type.'
      schema: { type: string, maxLength: 512 }
    EventCursor:
      name: cursor
      in: query
      description: 'A frame''s `id` to continue after. `Last-Event-ID` wins when both are sent.'
      schema: { type: string, maxLength: 64, pattern: '^[0-9]{1,16}\.[0-9]{1,16}$' }
  responses:
    Unauthorized:
      description: No token, or one that is not valid (expired, wrong issuer or audience, unknown key, bad signature). The reason is in the service log and never in the response.
      headers:
        WWW-Authenticate: { schema: { type: string, example: Bearer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The token is valid and grants no role, or grants `viewer` on a route that changes something, or the Origin is not allowed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: The principal's rate limit on mutating routes is spent (per instance).
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyStreams:
      description: 'The principal has `maxPerPrincipal` event streams open (429), or the instance has `maxStreams` open (503). Close one or retry later.'
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Timeout:
      description: The request ran out of time. For a route that changes something, the outcome is unknown.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: The body or a query parameter is not valid (`invalid_request`, `unsupported_option`, `confirmation_required`, `offset_too_large`, or for a webhook address `invalid_url`, `scheme_not_allowed`, `credentials_not_allowed`, `host_not_allowed`). `details` says which.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such job (`job_not_found`), cron (`cron_not_found`), flow (`flow_not_found`), webhook (`webhook_not_found`), webhook delivery (`delivery_not_found`) or workflow run (`execution_not_found`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: |
        The job or queue is not in a state the action applies to (`job_state`, `flow_protected`), or the job has moved on
        since the `expectedVersion` the caller read (`version_conflict`), or an event position is past the end of the
        journal (`cursor_ahead`), or a flow action does not apply (`flow_changed`, `flow_active`, `flow_not_retryable`,
        `flow_not_stuck`, `flow_too_large`), or a webhook action does not apply (`webhook_limit`, `webhook_key_missing`, `webhook_disabled`, `delivery_not_failed`), or a workflow action does not apply (`version_conflict`, `execution_terminal`,
        `execution_state`, `workflow_progressing`, `signal_rejected`). Nothing was changed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PublishFailed:
      description: '`publish_failed`: the job that makes a worker act on a workflow run could not be published. `details.claimed` says whether the run had already been changed; the tick publishes again once the run has been quiet for the idle window.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: The body is over the size limit of the route (`payload_too_large`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotSupported:
      description: '`not_supported`: Qelay did it and this service does not. `details.capability` says which.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotImplemented:
      description: '`not_implemented`: this deployment does not serve it yet. `not_supported`: Qelay did it and this service does not (`details.capability` says which).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      description: Every error response has exactly this body, and never a stack trace, SQL or a payload.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              pattern: '^[a-z][a-z0-9_]*$'
              description: Stable. Callers branch on it, never on `message`.
              example: unauthorized
            message: { type: string }
            details: { type: object, additionalProperties: true }
    Health:
      type: object
      required: [ok, status, version, uptime]
      properties:
        ok: { type: boolean, enum: [true] }
        status: { type: string, enum: [healthy] }
        version: { type: string, example: 1.0.0 }
        uptime: { type: integer, minimum: 0, description: Whole seconds since the process built its routes. }
    CheckState:
      type: string
      enum: [ok, failed, unknown]
    Readiness:
      type: object
      required: [ok, ready, checks, timestamp]
      properties:
        ok: { type: boolean }
        ready: { type: boolean }
        checks:
          type: object
          required: [database, transport, tick]
          properties:
            database:
              type: object
              required: [state]
              properties: { state: { $ref: '#/components/schemas/CheckState' } }
            transport:
              type: object
              required: [state]
              properties: { state: { $ref: '#/components/schemas/CheckState' } }
            schema:
              type: object
              description: >-
                Present when the process can read the schema version. `behind` (the database lacks a
                migration this build needs) makes the service not ready; `ahead` and `unknown` do not.
              required: [state, current, expected]
              properties:
                state: { type: string, enum: [current, behind, ahead, unknown] }
                current: { type: integer, nullable: true, description: The highest migration the database records. }
                expected: { type: integer, description: The highest migration this build knows. }
            tick:
              type: object
              required: [lastSuccessAt, lastFailureAt, ageMs]
              properties:
                lastSuccessAt: { type: integer, nullable: true }
                lastFailureAt: { type: integer, nullable: true }
                ageMs: { type: integer, nullable: true, description: On the database's clock. }
        timestamp: { type: integer }
        storage:
          type: object
          description: Only when not ready. The panel's probe reads `storage.error`.
          required: [diskFull, error, since]
          properties:
            diskFull: { type: boolean, enum: [false] }
            error: { type: string, nullable: true }
            since: { type: integer, nullable: true }
    Capabilities:
      type: object
      required: [transport, features, hidden, unsupported, principal, version]
      properties:
        transport:
          type: object
          required: [name, maxDeliverDelayMs, ordering]
          properties:
            name: { type: string, example: gcp-pubsub }
            maxDeliverDelayMs: { type: integer, minimum: 0, nullable: true, description: Null means unbounded. }
            ordering: { type: string, enum: [none, best-effort] }
        features:
          type: object
          required: [dlq, cron, flows, workflows, webhooks]
          properties:
            dlq: { type: boolean }
            cron: { type: boolean }
            flows: { type: boolean }
            workflows: { type: boolean }
            webhooks: { type: boolean }
        hidden:
          type: array
          items: { type: string }
          example: [serverControl, sqliteDatabase, s3Backup, fleet, queueOperations]
        unsupported:
          type: array
          description: Actions that exist in the panel and are closed here (they answer 501 `not_supported`), so a client leaves the control out.
          items: { type: string }
          example: [job-fail, job-discard, job-retry, job-move-to-delayed, dlq-retry, dlq-auto-retry, dlq-retention]
        principal:
          type: object
          description: The caller's own role. A client leaves out the controls the role may not use; the server still decides.
          required: [role]
          properties:
            role: { type: string, enum: [viewer, operator] }
        version: { type: string }
    OverviewStats:
      type: object
      required: [waiting, active, delayed, completed, dlq, totalPushed, totalPulled, totalCompleted, totalFailed, uptime]
      properties:
        waiting: { type: number }
        active: { type: number }
        delayed: { type: number }
        completed: { type: number }
        dlq: { type: number }
        totalPushed: { type: number }
        totalPulled: { type: number }
        totalCompleted: { type: number }
        totalFailed: { type: number }
        uptime: { type: number }
    Throughput:
      type: object
      required: [pushPerSec, pullPerSec, completePerSec, failPerSec]
      properties:
        pushPerSec: { type: number }
        pullPerSec: { type: number }
        completePerSec: { type: number }
        failPerSec: { type: number }
    Memory:
      type: object
      required: [heapUsed, heapTotal, rss]
      properties:
        heapUsed: { type: number }
        heapTotal: { type: number }
        rss: { type: number }
    Overview:
      type: object
      required: [ok, stats, throughput, latency, memory, collections, workers, crons, storage, timestamp]
      properties:
        ok: { type: boolean }
        stats: { $ref: '#/components/schemas/OverviewStats' }
        throughput: { $ref: '#/components/schemas/Throughput' }
        latency:
          type: object
          required: [averages, percentiles]
          properties:
            averages: { type: object, additionalProperties: { type: number } }
            percentiles:
              type: object
              additionalProperties:
                type: object
                required: [p50, p95, p99]
                properties:
                  p50: { type: number }
                  p95: { type: number }
                  p99: { type: number }
        memory: { $ref: '#/components/schemas/Memory' }
        collections: { type: object, additionalProperties: { type: number } }
        workers:
          type: object
          required: [total, active, list, truncated]
          properties:
            total: { type: number }
            active: { type: number }
            truncated: { type: boolean }
            list:
              type: array
              items:
                type: object
                required: [id, name, queues, lastSeen, activeJobs, processedJobs, failedJobs]
                properties:
                  id: { type: string }
                  name: { type: string }
                  queues: { type: array, items: { type: string } }
                  lastSeen: { type: number }
                  activeJobs: { type: number }
                  processedJobs: { type: number }
                  failedJobs: { type: number }
        crons:
          type: object
          required: [total, list, truncated]
          properties:
            total: { type: number }
            truncated: { type: boolean }
            list:
              type: array
              items:
                type: object
                required: [name, queue, schedule, repeatEvery, nextRun, executions]
                properties:
                  name: { type: string }
                  queue: { type: string }
                  schedule: { type: string, nullable: true }
                  repeatEvery: { type: number, nullable: true }
                  nextRun: { type: number }
                  executions: { type: number }
        storage: { type: object, additionalProperties: true }
        timestamp: { type: integer }
    Stats:
      type: object
      required: [ok, stats, memory, collections]
      properties:
        ok: { type: boolean }
        stats:
          allOf:
            - $ref: '#/components/schemas/OverviewStats'
            - $ref: '#/components/schemas/Throughput'
            - type: object
              required: [prioritized, waiting-children]
              properties:
                prioritized: { type: number }
                waiting-children: { type: number }
              additionalProperties: { type: number }
        memory:
          allOf:
            - $ref: '#/components/schemas/Memory'
            - type: object
              required: [external, arrayBuffers]
              properties:
                external: { type: number }
                arrayBuffers: { type: number }
        collections: { type: object, additionalProperties: { type: number } }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, enum: [true] }
    ActionCount:
      type: object
      required: [ok, count, done]
      properties:
        ok: { type: boolean, enum: [true] }
        count: { type: integer, minimum: 0 }
        done: { type: boolean, description: False when the call stopped at its time budget and more is left. }
    LogsCleared:
      type: object
      required: [ok, count]
      properties:
        ok: { type: boolean, enum: [true] }
        count: { type: integer, minimum: 0 }
    QueueCounts:
      type: object
      required: [waiting, prioritized, delayed, active, completed, failed, waiting-children, paused]
      additionalProperties: { type: integer }
      properties:
        waiting: { type: integer }
        prioritized: { type: integer }
        delayed: { type: integer }
        active: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
        waiting-children: { type: integer }
        paused: { type: integer }
    QueueCountsResponse:
      type: object
      required: [ok, counts]
      properties:
        ok: { type: boolean }
        counts: { $ref: '#/components/schemas/QueueCounts' }
    QueuePausedResponse:
      type: object
      required: [ok, paused]
      properties:
        ok: { type: boolean }
        paused: { type: boolean }
    QueueSummaryRow:
      type: object
      required: [name, paused, counts]
      properties:
        name: { type: string }
        paused: { type: boolean }
        counts:
          type: object
          required: [waiting, prioritized, active, completed, failed, delayed]
          properties:
            waiting: { type: integer }
            prioritized: { type: integer }
            active: { type: integer }
            completed: { type: integer }
            failed: { type: integer }
            delayed: { type: integer }
    DashboardQueues:
      type: object
      required: [ok, queues, total, limit, offset, timestamp]
      properties:
        ok: { type: boolean }
        queues:
          type: array
          items:
            type: object
            required: [name, waiting, delayed, active, dlq, paused]
            properties:
              name: { type: string }
              waiting: { type: integer }
              delayed: { type: integer }
              active: { type: integer }
              dlq: { type: integer, description: Failed jobs. }
              paused: { type: boolean }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        timestamp: { type: integer }
    JobSummary:
      type: object
      required: [id, priority, createdAt, runAt, attempts, progress]
      properties:
        id: { type: string }
        priority: { type: integer }
        createdAt: { type: integer }
        runAt: { type: integer }
        attempts: { type: integer }
        progress: { type: number }
    QueueDetail:
      type: object
      required: [ok, name, counts, paused, priorityCounts, dlqPreview, timestamp]
      properties:
        ok: { type: boolean }
        name: { type: string }
        counts: { $ref: '#/components/schemas/QueueCounts' }
        paused: { type: boolean }
        priorityCounts: { type: object, additionalProperties: { type: integer } }
        dlqPreview:
          type: array
          items:
            type: object
            required: [id, data, attempts, createdAt]
            properties:
              id: { type: string }
              data: {}
              attempts: { type: integer }
              createdAt: { type: integer }
        jobs:
          type: object
          description: Absent when `includeJobs=false`.
          required: [waiting, active, delayed, paused]
          properties:
            waiting: { type: array, items: { $ref: '#/components/schemas/JobSummary' } }
            active: { type: array, items: { $ref: '#/components/schemas/JobSummary' } }
            delayed: { type: array, items: { $ref: '#/components/schemas/JobSummary' } }
            paused: { type: array, items: { $ref: '#/components/schemas/JobSummary' } }
        timestamp: { type: integer }
    Job:
      type: object
      required: [id, queue, name, data, priority, createdAt, runAt, startedAt, completedAt, attempts, maxAttempts, backoff, backoffConfig, timeout, ttl, progress, progressMessage, customId, parentId, childrenIds, dependsOn, flowRoot, tags, groupId, removeOnComplete, removeOnFail, state, version, lease, lifo, deduplicationId, truncated]
      properties:
        id: { type: string }
        queue: { type: string }
        name: { type: string }
        data: { description: 'The payload, with tagged values (see the description of this document).' }
        returnvalue: { description: Present for a completed job that returned a value. }
        result: { description: The same as `returnvalue` (the panel's legacy alias). }
        failedReason: { type: string }
        priority: { type: integer }
        createdAt: { type: integer }
        runAt: { type: integer }
        startedAt: { type: integer, nullable: true }
        completedAt: { type: integer, nullable: true }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        backoff: { type: integer }
        backoffConfig:
          type: object
          nullable: true
          required: [type, delay]
          properties:
            type: { type: string, enum: [fixed, exponential] }
            delay: { type: integer }
            maxDelay: { type: integer }
        timeout: { type: integer, nullable: true }
        ttl: { type: integer, nullable: true }
        progress: { type: number, minimum: 0, maximum: 100 }
        progressMessage: { type: string, nullable: true }
        stacktrace: { type: array, nullable: true, items: { type: string }, description: Only on a job's own page. }
        customId: { type: string, nullable: true }
        parentId: { type: string, nullable: true }
        childrenIds: { type: array, items: { type: string }, description: 'The jobs that name this one as their parent. Only on a job''s own page; a list leaves it empty.' }
        dependsOn: { type: array, items: { type: string }, description: Always empty; a parent's children are `childrenIds`. }
        flowRoot: { type: string, nullable: true, description: The root of the flow the job belongs to. }
        tags: { type: array, items: { type: string } }
        groupId: { type: string, nullable: true }
        removeOnComplete: { type: boolean }
        removeOnFail: { type: boolean }
        stallCount: { type: integer, description: Only on a job's own page. }
        state: { type: string, enum: [waiting, prioritized, delayed, waiting-children, active, completed, failed] }
        timeline:
          type: array
          maxItems: 20
          description: Only on a job's own page. Creation first, then at most 19 of the newest entries.
          items:
            type: object
            required: [state, timestamp]
            properties:
              state: { type: string }
              timestamp: { type: integer }
              error: { type: string }
              attempt: { type: integer }
        version: { type: integer, minimum: 0, description: What an action sends back as `expectedVersion`. }
        lease:
          type: object
          nullable: true
          required: [owner, until]
          properties:
            owner: { type: string }
            until: { type: integer }
        lifo: { type: boolean }
        stallTimeout: { type: integer }
        deduplicationId: { type: string, nullable: true }
        truncated: { type: boolean, description: True when `data` or `returnvalue` is a `truncated` marker. }
    JobEnvelope:
      type: object
      required: [ok, job]
      properties:
        ok: { type: boolean }
        job: { $ref: '#/components/schemas/Job' }
    JobsList:
      type: object
      required: [ok, jobs, limit]
      properties:
        ok: { type: boolean }
        jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
        limit: { type: integer }
        offset: { type: integer, description: Present for an offset page. }
        total: { type: integer, description: Present for an offset page. }
        next: { type: string, description: The `cursor` of the next page; absent on the last. }
    JobResult:
      type: object
      required: [ok, id, result, truncated]
      properties:
        ok: { type: boolean }
        id: { type: string }
        result: { nullable: true }
        truncated: { type: boolean }
    JobLogs:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [logs, count]
          properties:
            logs:
              type: array
              items:
                type: object
                required: [timestamp, level, message]
                properties:
                  timestamp: { type: integer }
                  level: { type: string, enum: [info, warn, error] }
                  message: { type: string }
            count: { type: integer }
    JobChildren:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [values]
          properties:
            values: { type: object, additionalProperties: true }
    AddedJob:
      type: object
      required: [ok, id, duplicated]
      properties:
        ok: { type: boolean }
        id: { type: string }
        duplicated: { type: boolean }
    AddedJobs:
      type: object
      required: [ok, ids, duplicated]
      properties:
        ok: { type: boolean }
        ids: { type: array, items: { type: string } }
        duplicated: { type: array, items: { type: integer }, description: Indexes in `ids` of the jobs that were live duplicates. }
    BackoffOption:
      oneOf:
        - { type: integer, minimum: 0 }
        - type: object
          additionalProperties: false
          required: [type, delay]
          properties:
            type: { type: string, enum: [fixed, exponential] }
            delay: { type: integer, minimum: 0 }
            maxDelay: { type: integer, minimum: 0 }
    AddJobBody:
      type: object
      additionalProperties: false
      required: [data]
      description: 'A field outside this list is 400. `ttl`, `repeat`, `dependsOn`, `tags`, `durable: false` and numeric `removeOnComplete` or `removeOnFail` are 400 `unsupported_option`.'
      properties:
        name: { type: string, minLength: 1, description: Default `default`. }
        data: { description: 'Any JSON, with tagged values. `null` is a value.' }
        priority: { type: integer, minimum: 0 }
        delay: { type: number, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        backoff: { $ref: '#/components/schemas/BackoffOption' }
        timeout: { type: integer, minimum: 1 }
        jobId: { type: string, minLength: 1 }
        removeOnComplete: { type: boolean }
        removeOnFail: { type: boolean }
        uniqueKey: { type: string, minLength: 1 }
        lifo: { type: boolean }
        groupId: { type: string, minLength: 1 }
        groupMaxSize: { type: integer, minimum: 1 }
        durable: { type: boolean }
        ttl: { type: number }
        tags: { type: array, items: { type: string } }
        dependsOn: { type: array, items: { type: string } }
        repeat: {}
    BulkAddBody:
      type: object
      additionalProperties: false
      required: [jobs]
      properties:
        jobs:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            allOf:
              - $ref: '#/components/schemas/AddJobBody'
              - type: object
                properties:
                  customId: { type: string, minLength: 1, description: Bulk's name for `jobId`; give one. }
                  stallTimeout: { type: integer, minimum: 1 }
                  dedup: { type: object, additionalProperties: false, properties: { ttl: { type: integer, minimum: 1 }, extend: { type: boolean }, replace: { type: boolean } } }
                  stackTraceLimit: { type: integer }
                  timestamp: { type: number }
    FenceBody:
      type: object
      additionalProperties: false
      properties:
        expectedVersion: { type: integer, minimum: 0 }
    DataBody:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { description: The new payload. `null` is a value. }
        expectedVersion: { type: integer, minimum: 0 }
    PriorityBody:
      type: object
      additionalProperties: false
      required: [priority]
      properties:
        priority: { type: integer, minimum: 0 }
        lifo: { type: boolean }
        expectedVersion: { type: integer, minimum: 0 }
    DelayBody:
      type: object
      additionalProperties: false
      required: [delay]
      properties:
        delay: { type: number, minimum: 0, description: Milliseconds from now. }
        expectedVersion: { type: integer, minimum: 0 }
    ProgressBody:
      type: object
      additionalProperties: false
      required: [progress]
      properties:
        progress: { oneOf: [{ type: number }, { type: string }, { type: object }] }
        message: { type: string, maxLength: 4096 }
    LogBody:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 16384 }
        level: { type: string, enum: [info, warn, error] }
    ConfirmBody:
      type: object
      additionalProperties: false
      properties:
        confirm: { type: string, description: Must equal the queue's name. }
    CleanBody:
      type: object
      additionalProperties: false
      properties:
        confirm: { type: string, description: Must equal the queue's name. }
        grace: { type: integer, minimum: 0, description: Only jobs at least this many ms old. }
        state: { type: string, enum: [completed, failed, wait, waiting, prioritized, delayed], description: Default `completed`. }
        limit: { type: integer, minimum: 0, description: At most this many; 0 or absent is every eligible job. }
    ObliterateBody:
      type: object
      additionalProperties: false
      properties:
        confirm: { type: string, description: Must equal the queue's name. }
        force: { type: boolean, description: Delete active jobs too. }
    PromoteJobsBody:
      type: object
      additionalProperties: false
      properties:
        count: { type: integer, minimum: 1, maximum: 1000, description: Default 1000. }
    RateLimitBody:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        limit: { type: integer, minimum: 1, description: Jobs per window. }
        duration: { type: integer, minimum: 1, description: Window length in ms; default 1000. }
        ttl: { type: integer, minimum: 1, description: The limit lifts itself after this many ms. }
    ConcurrencyBody:
      type: object
      additionalProperties: false
      required: [concurrency]
      properties:
        concurrency: { type: integer, minimum: 1 }
    DlqAttempt:
      type: object
      required: [attempt, startedAt, failedAt, reason, error, duration]
      properties:
        attempt: { type: integer, minimum: 1 }
        startedAt: { type: integer }
        failedAt: { type: integer }
        reason: { type: string }
        error: { type: string, nullable: true }
        duration: { type: integer, minimum: 0, description: Milliseconds the attempt ran. }
    DlqEntry:
      type: object
      required: [job, enteredAt, reason, error, attempts, expiresAt]
      properties:
        job: { $ref: '#/components/schemas/Job' }
        enteredAt: { type: integer, description: When the last attempt failed. }
        reason: { type: string, description: 'For example `max_attempts_exceeded`, `explicit_fail`, `timeout`, `stalled`.' }
        error: { type: string, nullable: true }
        attempts: { type: array, items: { $ref: '#/components/schemas/DlqAttempt' } }
        expiresAt: { type: integer, nullable: true, description: When the queue's `maxAge` removes it; null keeps it for ever. }
    FlowRoot:
      type: object
      required: [id, queue, name, state, createdAt, version, total, states, blocked]
      properties:
        id: { type: string }
        queue: { type: string }
        name: { type: string, nullable: true }
        state: { type: string, enum: [waiting, prioritized, delayed, waiting-children, active, completed, failed] }
        createdAt: { type: integer }
        version: { type: integer }
        total: { type: integer, minimum: 0, description: Jobs of the flow that are stored now. }
        states: { type: object, additionalProperties: { type: integer }, description: Stored jobs by state. }
        blocked: { type: integer, minimum: 0, description: Failed children that hold a waiting parent back. }
    FlowList:
      type: object
      required: [ok, flows, total, limit, offset]
      properties:
        ok: { type: boolean, enum: [true] }
        flows: { type: array, items: { $ref: '#/components/schemas/FlowRoot' } }
        total: { type: integer, minimum: 0, description: Flows in the namespace. }
        limit: { type: integer }
        offset: { type: integer }
    FlowNode:
      type: object
      required: [id, queue, state, version, parentId, depth, attempts, createdAt, completedAt, error, mode, blocking, removed]
      properties:
        id: { type: string }
        queue: { type: string }
        state: { type: string, enum: [waiting, prioritized, delayed, waiting-children, active, completed, failed] }
        version: { type: integer, nullable: true, description: Null for a child that only a completion record is left of. }
        parentId: { type: string, nullable: true }
        depth: { type: integer, minimum: 0, description: Levels below the root, which is 0. }
        attempts: { type: integer }
        createdAt: { type: integer, nullable: true }
        completedAt: { type: integer, nullable: true }
        error: { type: string, nullable: true, description: The failure message, cut to 500 characters. }
        mode: { type: string, nullable: true, enum: [fail, continue, ignore, remove], description: What this job's failure does to its parent. }
        blocking: { type: boolean, description: The job failed and its parent still waits for it. }
        removed: { type: boolean, description: The job was removed when it completed. }
    FlowFailure:
      type: object
      required: [parentId, childId, queue, mode, error]
      properties:
        parentId: { type: string }
        childId: { type: string }
        queue: { type: string }
        mode: { type: string, enum: [continue, ignore] }
        error: { type: string }
    Flow:
      type: object
      required: [root, nodes, total, truncated, limit, failures]
      properties:
        root: { type: string }
        nodes: { type: array, items: { $ref: '#/components/schemas/FlowNode' } }
        total: { type: integer, minimum: 0, description: Jobs of the flow that are stored now, listed or not. }
        truncated: { type: boolean, description: The flow has more jobs than `nodes` lists. }
        limit: { type: integer }
        failures: { type: array, items: { $ref: '#/components/schemas/FlowFailure' } }
    FlowEnvelope:
      type: object
      required: [ok, flow]
      properties:
        ok: { type: boolean, enum: [true] }
        flow: { $ref: '#/components/schemas/Flow' }
    FlowActionBody:
      type: object
      additionalProperties: false
      required: [action, jobs]
      properties:
        action: { type: string, enum: [retry-failed, promote, remove] }
        jobs:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [id, expectedVersion]
            properties:
              id: { type: string, minLength: 1 }
              expectedVersion: { type: integer, minimum: 0 }
        parent: { type: string, description: 'Required for `promote`, and not allowed for the others.' }
        confirm: { type: string, description: 'Required for `remove`: the root id of the flow.' }
    FlowActionResult:
      type: object
      required: [ok, action, changes]
      properties:
        ok: { type: boolean, enum: [true] }
        action: { type: string, enum: [retry-failed, promote, remove] }
        changes:
          type: array
          items:
            type: object
            required: [id, queue, from, to]
            properties:
              id: { type: string }
              queue: { type: string }
              from: { type: string }
              to: { type: string, description: 'A job state, or `removed`.' }
    WorkflowState:
      type: string
      enum: [running, waiting, completed, failed, compensating, compensation-stuck]
    WorkflowSummary:
      type: object
      required: [id, workflowName, state, definitionHash, parentExecutionId, currentNodeIndex, rollbackStatus, failureReason, committedAt, version, createdAt, updatedAt, wait]
      properties:
        id: { type: string }
        workflowName: { type: string }
        state: { $ref: '#/components/schemas/WorkflowState' }
        definitionHash: { type: string, nullable: true, description: The definition the run is bound to. }
        parentExecutionId: { type: string, nullable: true, description: Set for a sub-workflow run. }
        currentNodeIndex: { type: integer, minimum: 0 }
        rollbackStatus: { type: string, nullable: true, enum: [completed, not-applicable, stuck, null], description: 'Null until the unwind of a failed run has an outcome.' }
        failureReason: { type: string, nullable: true, description: Cut to 1,000 characters. }
        committedAt: { type: integer, nullable: true, description: When the run passed its pivot. }
        version: { type: integer, minimum: 0, description: What an action sends back as `expectedVersion`. }
        createdAt: { type: integer }
        updatedAt: { type: integer }
        wait:
          type: object
          nullable: true
          description: While parked at a `waitFor`.
          required: [event, deadlineAt]
          properties:
            event: { type: string }
            deadlineAt: { type: integer, nullable: true, description: When the wait times out; null waits for ever. }
    WorkflowDefinition:
      type: object
      required: [hash, revision, nodes, firstSeenAt, lastSeenAt, served, liveRuns]
      properties:
        hash: { type: string }
        revision: { type: string }
        nodes: { type: integer, minimum: 0 }
        firstSeenAt: { type: integer }
        lastSeenAt: { type: integer }
        served: { type: boolean, description: A worker announced it within the served window. }
        liveRuns: { type: integer, minimum: 0, description: Live runs bound to this hash. }
    WorkflowWarning:
      type: object
      required: [code, workflow, hash, runs, known, lastSeenAt, message]
      properties:
        code: { type: string, enum: [unserved_definition] }
        workflow: { type: string }
        hash: { type: string }
        runs: { type: integer, minimum: 1 }
        known: { type: boolean, description: Some worker announced this hash (it may have aged out of the registry). }
        lastSeenAt: { type: integer, nullable: true }
        message: { type: string }
    WorkflowOverview:
      type: object
      required: [name, total, counts, definitions, warnings]
      properties:
        name: { type: string }
        total: { type: integer, minimum: 0 }
        counts: { type: object, additionalProperties: { type: integer }, description: Runs by state; a state with none is absent. }
        definitions: { type: array, items: { $ref: '#/components/schemas/WorkflowDefinition' } }
        warnings: { type: array, items: { $ref: '#/components/schemas/WorkflowWarning' } }
    WorkflowList:
      type: object
      required: [ok, workflows, executions, total, limit, offset, hasMore]
      properties:
        ok: { type: boolean, enum: [true] }
        workflows: { type: array, items: { $ref: '#/components/schemas/WorkflowOverview' } }
        executions: { type: array, items: { $ref: '#/components/schemas/WorkflowSummary' } }
        total: { type: integer, minimum: 0, description: Runs that match the filters. }
        limit: { type: integer }
        offset: { type: integer }
        hasMore: { type: boolean }
    WorkflowFanOut:
      type: object
      required: [iterations, byStatus, compensation]
      properties:
        iterations: { type: integer, minimum: 0 }
        byStatus:
          type: object
          required: [pending, running, completed, failed]
          properties:
            pending: { type: integer }
            running: { type: integer }
            completed: { type: integer }
            failed: { type: integer }
        compensation:
          type: object
          required: [compensated, failed, skipped]
          properties:
            compensated: { type: integer }
            failed: { type: integer }
            skipped: { type: integer }
    WorkflowStep:
      type: object
      required: [name, status, attempts, startedAt, completedAt, durationMs, compensatable, error, childExecutionId, compensation, loopIndex]
      properties:
        name: { type: string, description: 'An iteration of a fan-out is `<step>:<n>`.' }
        status: { type: string, enum: [pending, running, completed, failed] }
        attempts: { type: integer, nullable: true }
        startedAt: { type: integer, nullable: true }
        completedAt: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true }
        compensatable: { type: boolean }
        error: { type: string, nullable: true, description: Cut to 2,000 characters. }
        errorTruncated: { type: boolean, enum: [true] }
        result: { description: 'Present when the step holds a result: tagged JSON, or a `truncated` marker.' }
        resultTruncated: { type: boolean, enum: [true] }
        childExecutionId: { type: string, nullable: true }
        compensation:
          type: object
          nullable: true
          required: [status, at, error]
          properties:
            status: { type: string, enum: [compensated, compensation-failed, compensation-skipped] }
            at: { type: integer }
            error: { type: string, nullable: true }
        loopIndex: { type: integer, nullable: true }
        loopItem: { description: The item of a fan-out iteration, as `result` is. }
        loopItemTruncated: { type: boolean, enum: [true] }
        fanOut: { $ref: '#/components/schemas/WorkflowFanOut' }
    WorkflowStepsPage:
      type: object
      required: [items, total, limit, offset, hasMore]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkflowStep' } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }
        hasMore: { type: boolean }
    WorkflowStepsEnvelope:
      type: object
      required: [ok, steps]
      properties:
        ok: { type: boolean, enum: [true] }
        steps: { $ref: '#/components/schemas/WorkflowStepsPage' }
    WorkflowCompensation:
      type: object
      required: [status, eligible, compensated, failed, skipped, failures]
      properties:
        status: { type: string, enum: [none, pending, running, stuck, completed, not-applicable] }
        eligible: { type: integer, description: Completed steps that declared a reversal and have no outcome yet. }
        compensated: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
        failures:
          type: array
          description: At most 10.
          items:
            type: object
            required: [step, error]
            properties:
              step: { type: string }
              error: { type: string, nullable: true }
    WorkflowExecution:
      allOf:
        - $ref: '#/components/schemas/WorkflowSummary'
        - type: object
          required: [input, signals, output, actions]
          properties:
            input: { description: Tagged JSON, or a `truncated` marker. }
            inputTruncated: { type: boolean, enum: [true] }
            signals:
              type: object
              required: [total, items]
              properties:
                total: { type: integer }
                items:
                  type: array
                  description: At most 50.
                  items:
                    type: object
                    required: [event, payload]
                    properties:
                      event: { type: string }
                      payload: {}
                      truncated: { type: boolean, enum: [true] }
            output:
              type: object
              nullable: true
              required: [step, result]
              properties:
                step: { type: string }
                result: {}
                truncated: { type: boolean, enum: [true] }
            actions:
              type: array
              items: { type: string, enum: [signal, cancel, retry-compensation, abandon-compensation, recover] }
    WorkflowDetail:
      type: object
      required: [ok, execution, definition, steps, children, compensation]
      properties:
        ok: { type: boolean, enum: [true] }
        execution: { $ref: '#/components/schemas/WorkflowExecution' }
        definition:
          type: object
          nullable: true
          required: [hash, revision, graph, firstSeenAt, lastSeenAt, served]
          properties:
            hash: { type: string }
            revision: { type: string }
            graph: { type: array, items: { type: object }, description: 'The step graph the worker announced: `{ type, ... }` per node.' }
            firstSeenAt: { type: integer }
            lastSeenAt: { type: integer }
            served: { type: boolean }
        steps: { $ref: '#/components/schemas/WorkflowStepsPage' }
        children:
          type: object
          required: [total, items]
          properties:
            total: { type: integer }
            items:
              type: array
              description: At most 100.
              items:
                type: object
                required: [step, executionId]
                properties:
                  step: { type: string }
                  executionId: { type: string }
        compensation: { $ref: '#/components/schemas/WorkflowCompensation' }
    WorkflowActionBody:
      type: object
      additionalProperties: false
      required: [action, expectedVersion]
      properties:
        action: { type: string, enum: [signal, cancel, retry-compensation, abandon-compensation, recover] }
        expectedVersion: { type: integer, minimum: 0, description: The run's `version` as read. }
        event: { type: string, minLength: 1, maxLength: 256, description: 'Required for `signal`, and not allowed for the others.' }
        payload: { description: '`signal` only: the event''s payload, in the tagged form of the job routes.' }
        reason: { type: string, minLength: 1, maxLength: 500, description: '`cancel` only: kept as the failure reason.' }
        confirm: { type: string, description: 'Required for `cancel` and `abandon-compensation`: the run id.' }
    WorkflowActionResult:
      type: object
      required: [ok, action, executionId, published, version]
      properties:
        ok: { type: boolean, enum: [true] }
        action: { type: string, enum: [signal, cancel, retry-compensation, abandon-compensation, recover] }
        executionId: { type: string }
        published: { type: boolean, description: A step job went to the engine queue for a worker to execute. }
        resumed: { type: boolean, description: '`signal` only: this call resumed a parked run.' }
        version: { type: integer, nullable: true, description: The run's version after this call's claim; null when the store or the worker claims. }
    DlqList:
      type: object
      required: [ok, entries, total, limit, offset]
      properties:
        ok: { type: boolean, enum: [true] }
        entries: { type: array, items: { $ref: '#/components/schemas/DlqEntry' } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }
    DlqStats:
      type: object
      required: [total, byReason, byQueue, pendingRetry, expired, oldestEntry, newestEntry]
      properties:
        total: { type: integer }
        byReason: { type: object, additionalProperties: { type: integer } }
        byQueue: { type: object, additionalProperties: { type: integer } }
        pendingRetry: { type: integer, enum: [0] }
        expired: { type: integer, enum: [0] }
        oldestEntry: { type: integer, nullable: true }
        newestEntry: { type: integer, nullable: true }
    DlqStatsResponse:
      type: object
      required: [ok, stats]
      properties:
        ok: { type: boolean, enum: [true] }
        stats: { $ref: '#/components/schemas/DlqStats' }
    StallConfig:
      type: object
      required: [enabled, stallInterval, maxStalls, gracePeriod]
      properties:
        enabled: { type: boolean, enum: [true] }
        stallInterval: { type: integer, description: The lease length in ms. }
        maxStalls: { type: integer, minimum: 0, description: A job that stalls more often than this fails. }
        gracePeriod: { type: integer, enum: [0] }
    StallConfigResponse:
      type: object
      required: [ok, config]
      properties:
        ok: { type: boolean, enum: [true] }
        config: { $ref: '#/components/schemas/StallConfig' }
    StallConfigBody:
      type: object
      additionalProperties: false
      description: 'The settings bare, or wrapped as `{ "config": { ... } }`.'
      properties:
        enabled: { type: boolean }
        stallInterval: { type: number }
        maxStalls: { type: integer, minimum: 0 }
        gracePeriod: { type: number }
        config:
          type: object
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            stallInterval: { type: number }
            maxStalls: { type: integer, minimum: 0 }
            gracePeriod: { type: number }
    DlqConfig:
      type: object
      required: [autoRetry, autoRetryInterval, maxAutoRetries, maxAge, maxEntries]
      properties:
        autoRetry: { type: boolean, enum: [false] }
        autoRetryInterval: { type: integer }
        maxAutoRetries: { type: integer }
        maxAge: { type: integer, nullable: true, description: Milliseconds an entry is kept; null keeps it for ever. }
        maxEntries: { type: integer }
    DlqConfigResponse:
      type: object
      required: [ok, config]
      properties:
        ok: { type: boolean, enum: [true] }
        config: { $ref: '#/components/schemas/DlqConfig' }
    DlqConfigBody:
      type: object
      additionalProperties: false
      description: 'The settings bare, or wrapped as `{ "config": { ... } }`.'
      properties:
        autoRetry: { type: boolean }
        autoRetryInterval: { type: number }
        maxAutoRetries: { type: number }
        maxAge: { type: number, nullable: true }
        maxEntries: { type: integer }
        config:
          type: object
          additionalProperties: false
          properties:
            autoRetry: { type: boolean }
            autoRetryInterval: { type: number }
            maxAutoRetries: { type: number }
            maxAge: { type: number, nullable: true }
            maxEntries: { type: integer }
    CronJobOptions:
      type: object
      additionalProperties: false
      description: The template of the jobs a cron creates.
      properties:
        maxAttempts: { type: integer, minimum: 1 }
        backoff: { $ref: '#/components/schemas/BackoffOption' }
        timeout: { type: integer, minimum: 1 }
        delay: { type: number }
        stallTimeout: { type: integer, minimum: 1 }
        removeOnComplete: { type: boolean }
        removeOnFail: { type: boolean }
    CronBody:
      type: object
      additionalProperties: false
      required: [queue]
      description: Exactly one of `schedule` and `repeatEvery`. `name` is required on `POST /crons` and optional on `PUT /crons/{name}`.
      properties:
        name: { type: string, minLength: 1, maxLength: 256 }
        queue: { type: string, minLength: 1, maxLength: 256 }
        jobName: { type: string, minLength: 1, maxLength: 256, description: Default `default`. }
        data: { description: The payload of every job it creates, in the tagged form of the job payloads. }
        schedule: { type: string, maxLength: 256, description: A cron expression (5 or 6 fields). }
        repeatEvery: { type: number, description: Milliseconds between occurrences. }
        timezone: { type: string, minLength: 1, maxLength: 256, description: An IANA zone; only with `schedule`. }
        priority: { type: integer, minimum: 0 }
        maxLimit: { type: number, description: Stops after this many executions. }
        immediately: { type: boolean, description: Fire once now as well. }
        skipIfNoWorker: { type: boolean }
        preventOverlap: { type: boolean }
        skipMissedOnRestart: { type: boolean, enum: [true], description: Always true; false is 400 `unsupported_option`. }
        uniqueKey: { type: string, minLength: 1, maxLength: 256 }
        dedup:
          type: object
          additionalProperties: false
          properties:
            ttl: { type: integer, minimum: 1 }
            extend: { type: boolean }
            replace: { type: boolean }
        jobOptions: { $ref: '#/components/schemas/CronJobOptions' }
    Cron:
      type: object
      required: [name, jobName, queue, schedule, repeatEvery, nextRun, executions, maxLimit, exhausted, timezone, priority, uniqueKey, dedup, skipMissedOnRestart, skipIfNoWorker, preventOverlap, jobOptions, updatedAt]
      properties:
        name: { type: string }
        jobName: { type: string }
        queue: { type: string }
        schedule: { type: string, nullable: true }
        repeatEvery: { type: number, nullable: true }
        nextRun: { type: integer, description: When it is next due. Stale once `exhausted`. }
        executions: { type: integer, minimum: 0 }
        maxLimit: { type: number, nullable: true }
        exhausted: { type: boolean, description: '`executions` reached `maxLimit`: nothing fires any more.' }
        timezone: { type: string, nullable: true }
        priority: { type: integer }
        uniqueKey: { type: string, nullable: true }
        dedup:
          type: object
          nullable: true
          properties:
            ttl: { type: integer }
            extend: { type: boolean }
            replace: { type: boolean }
        skipMissedOnRestart: { type: boolean, enum: [true] }
        skipIfNoWorker: { type: boolean }
        preventOverlap: { type: boolean }
        jobOptions:
          allOf:
            - { $ref: '#/components/schemas/CronJobOptions' }
          nullable: true
        updatedAt: { type: integer }
    CronEnvelope:
      type: object
      required: [ok, cron]
      properties:
        ok: { type: boolean, enum: [true] }
        cron: { $ref: '#/components/schemas/Cron' }
    CronList:
      type: object
      required: [ok, crons, total, truncated]
      properties:
        ok: { type: boolean, enum: [true] }
        crons: { type: array, items: { $ref: '#/components/schemas/Cron' } }
        total: { type: integer, minimum: 0 }
        truncated: { type: boolean }
    Worker:
      type: object
      required: [id, name, queues, concurrency, hostname, pid, status, registeredAt, lastSeen, activeJobs, processedJobs, failedJobs, currentJob, uptime]
      properties:
        id: { type: string }
        name: { type: string }
        queues: { type: array, items: { type: string } }
        concurrency: { type: integer }
        hostname: { type: string }
        pid: { type: integer }
        status: { type: string, enum: [active, stale] }
        registeredAt: { type: integer }
        lastSeen: { type: integer }
        activeJobs: { type: integer }
        processedJobs: { type: integer }
        failedJobs: { type: integer }
        currentJob: { type: object, nullable: true, description: 'Always null: the registry counts active jobs and does not name them.' }
        uptime: { type: integer, minimum: 0, description: Milliseconds since it registered. }
    WorkersList:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data:
          type: object
          required: [workers, stats]
          properties:
            workers: { type: array, items: { $ref: '#/components/schemas/Worker' } }
            stats:
              type: object
              required: [total, active, stale]
              properties:
                total: { type: integer }
                active: { type: integer }
                stale: { type: integer }
    WorkerRemoved:
      type: object
      required: [ok, removed]
      properties:
        ok: { type: boolean, enum: [true] }
        removed: { type: boolean }
    Webhook:
      type: object
      required: [id, url, urlRedacted, events, queue, signed, enabled, createdAt, lastTriggered, successCount, failureCount]
      properties:
        id: { type: string }
        url: { type: string, description: 'The address; for a `viewer` only its origin (`https://host/`), with `urlRedacted` true.' }
        urlRedacted: { type: boolean }
        events: { type: array, items: { $ref: '#/components/schemas/WebhookEvent' } }
        queue: { type: string, nullable: true, description: 'Only events of this queue are sent; null for every queue.' }
        signed: { type: boolean, description: 'Whether deliveries carry a signature. The secret itself is never returned.' }
        enabled: { type: boolean }
        createdAt: { type: integer }
        lastTriggered: { type: integer, nullable: true, description: 'When a delivery last succeeded.' }
        successCount: { type: integer }
        failureCount: { type: integer, description: 'Deliveries that used every attempt without success.' }
    WebhookEvent:
      type: string
      enum: [job.pushed, job.started, job.completed, job.failed, job.progress]
    WebhookCreate:
      type: object
      required: [url, events]
      additionalProperties: false
      properties:
        url: { type: string, maxLength: 2048 }
        events: { type: array, minItems: 1, maxItems: 5, items: { $ref: '#/components/schemas/WebhookEvent' } }
        queue: { type: string, nullable: true, maxLength: 256 }
        secret: { type: string, nullable: true, minLength: 16, maxLength: 256, description: 'Signs each delivery. Write-only.' }
        enabled: { type: boolean, default: true }
    WebhookEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data:
          type: object
          required: [webhook]
          properties:
            webhook: { $ref: '#/components/schemas/Webhook' }
    WebhooksList:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data:
          type: object
          required: [webhooks, stats]
          properties:
            webhooks: { type: array, items: { $ref: '#/components/schemas/Webhook' } }
            stats:
              type: object
              required: [total, enabled]
              properties:
                total: { type: integer }
                enabled: { type: integer }
    WebhookAttempt:
      type: object
      required: [attempt, at, durationMs, statusCode, error]
      properties:
        attempt: { type: integer }
        at: { type: integer, description: 'When the attempt started.' }
        durationMs: { type: integer }
        statusCode: { type: integer, nullable: true, description: 'The receiver''s status; null when none came back.' }
        error: { type: string, nullable: true, description: 'A short reason in words; never a response body or an address.' }
    WebhookDelivery:
      type: object
      required: [id, webhookId, event, queue, jobId, occurredAt, status, attempts, nextAttemptAt, lastStatusCode, lastError, history, createdAt, finishedAt]
      properties:
        id: { type: string, description: 'Also the `X-Webhook-Id` header: a receiver dedupes on it.' }
        webhookId: { type: string }
        event: { type: string, description: 'A `WebhookEvent`, or `webhook.test`.' }
        queue: { type: string }
        jobId: { type: string }
        occurredAt: { type: integer }
        status: { type: string, enum: [pending, sending, delivered, failed] }
        attempts: { type: integer }
        nextAttemptAt: { type: integer }
        lastStatusCode: { type: integer, nullable: true }
        lastError: { type: string, nullable: true }
        history: { type: array, items: { $ref: '#/components/schemas/WebhookAttempt' } }
        createdAt: { type: integer }
        finishedAt: { type: integer, nullable: true }
    DeliveryEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data:
          type: object
          required: [delivery]
          properties:
            delivery: { $ref: '#/components/schemas/WebhookDelivery' }
    DeliveriesPage:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data:
          type: object
          required: [deliveries, next]
          properties:
            deliveries: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } }
            next: { type: string, nullable: true }
    MetricsTotals:
      type: object
      required: [ok, metrics]
      properties:
        ok: { type: boolean, enum: [true] }
        metrics:
          type: object
          required: [totalPushed, totalPulled, totalCompleted, totalFailed]
          properties:
            totalPushed: { type: number }
            totalPulled: { type: number }
            totalCompleted: { type: number }
            totalFailed: { type: number }
    MetricsPoint:
      type: object
      required: [timestamp, completed, failed]
      properties:
        timestamp: { type: integer, description: The start of the window, in epoch milliseconds. }
        completed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
    MetricsSeries:
      type: object
      required: [ok, queue, minutes, resolution, points, totals]
      properties:
        ok: { type: boolean, enum: [true] }
        queue: { type: string }
        minutes: { type: integer }
        resolution: { type: integer, enum: [1, 5, 15, 60] }
        points: { type: array, items: { $ref: '#/components/schemas/MetricsPoint' } }
        totals:
          type: object
          required: [completed, failed]
          description: Since the queue began, whether or not the buckets still hold the minutes.
          properties:
            completed: { type: integer }
            failed: { type: integer }
    AuditEntry:
      type: object
      required: [id, occurredAt, finishedAt, subject, role, source, requestId, action, target, outcome, status, reason]
      properties:
        id: { type: integer }
        occurredAt: { type: integer }
        finishedAt: { type: integer, nullable: true, description: Null while `pending`. }
        subject: { type: string, description: The token's subject. }
        role: { type: string }
        source: { type: string, description: 'Where the token came from: `oidc` or `dev-token`.' }
        requestId: { type: string }
        action: { type: string, description: 'The route, for example `POST /queues/:queue/pause`.' }
        target: { type: string, description: 'The identifiers it acted on, for example `queue=emails`. Never a payload.' }
        outcome: { type: string, enum: [pending, success, rejected, failed] }
        status: { type: integer, nullable: true, description: HTTP status of the answer. }
        reason: { type: string, nullable: true, description: A short code for a refusal or a failure. }
    AuditLog:
      type: object
      required: [ok, entries, next]
      properties:
        ok: { type: boolean, enum: [true] }
        entries: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        next: { type: integer, nullable: true, description: 'Pass it as `before` for older entries; null when there are none.' }
    Ping:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data:
          type: object
          required: [pong, time]
          properties:
            pong: { type: boolean, enum: [true] }
            time: { type: integer }
    StorageStatus:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data:
          type: object
          required: [diskFull, error, since]
          properties:
            diskFull: { type: boolean, enum: [false] }
            error: { type: string, nullable: true }
            since: { type: integer, nullable: true }
    Freshness:
      type: object
      required: [observedAt, ageMs, maxStalenessMs, source]
      properties:
        observedAt: { type: integer, nullable: true, description: 'Epoch ms the numbers describe; null when they could not be read.' }
        ageMs: { type: integer, nullable: true, description: 'Milliseconds between `observedAt` and this response; null with it.' }
        maxStalenessMs: { type: integer, description: 'The most the numbers can lag by design (a metrics pipeline); 0 when exact.' }
        source: { type: string, description: 'For example `cloud-monitoring`, `postgres-counts`, `memory`, `unavailable`.' }
    DoorbellHealthRow:
      type: object
      required: [queue, claimable, notRung, reRingDue, oldestNotRungAgeMs, paused, capped]
      properties:
        queue: { type: string }
        claimable: { type: integer, description: 'Jobs a worker could claim now, counted up to a cap.' }
        notRung: { type: integer, description: 'Claimable jobs with no bell on record, past the enqueue grace: waiting for the tick.' }
        reRingDue: { type: integer, description: 'Claimable jobs whose last bell is old enough that the tick rings them again. Large and normal while a queue has more jobs than workers.' }
        oldestNotRungAgeMs: { type: integer, nullable: true }
        paused: { type: boolean }
        capped: { type: boolean, description: 'A count stopped at its cap: read it as "this many or more".' }
    TransportQueueStats:
      type: object
      required: [queue, doorbellDepth, inFlight, delayed, oldestUndeliveredAgeMs, deadLetterDepth, deadLetterOldestAgeMs, freshness, store]
      properties:
        queue: { type: string }
        doorbellDepth: { type: integer, nullable: true }
        inFlight: { type: integer, nullable: true, description: 'Bells taken and not yet acknowledged. Null where the broker does not count them: unknown, never zero.' }
        delayed: { type: integer, nullable: true, description: 'Bells held back for a later time. Null where the broker does not count them: unknown, never zero.' }
        oldestUndeliveredAgeMs: { type: integer, nullable: true }
        deadLetterDepth: { type: integer, nullable: true, description: 'Null on a transport with no dead-letter queue, and when it could not be read.' }
        deadLetterOldestAgeMs: { type: integer, nullable: true }
        freshness: { $ref: '#/components/schemas/Freshness' }
        store: { $ref: '#/components/schemas/DoorbellHealthRow' }
    TransportResponse:
      type: object
      required: [ok, transport, deadLetter, queues, truncated, timestamp]
      properties:
        ok: { type: boolean, enum: [true] }
        transport:
          type: object
          required: [name, maxDeliverDelayMs, ordering, approximateCounts]
          properties:
            name: { type: string }
            maxDeliverDelayMs: { type: integer, nullable: true }
            ordering: { type: string, enum: [none, best-effort] }
            approximateCounts: { type: boolean, description: 'The broker documents its counts as approximate (SQS: eventually consistent, about a minute behind). Show them as estimates.' }
        deadLetter:
          type: object
          required: [supported]
          properties:
            supported: { type: boolean, description: 'Whether the broker has a dead-letter queue of bells. The local transports do not.' }
        queues: { type: array, items: { $ref: '#/components/schemas/TransportQueueStats' } }
        truncated: { type: boolean, description: More queues exist than this response covers. }
        timestamp: { type: integer }
    DeadLetterItem:
      type: object
      required: [jobId, queue, deliveryCount, deadLetteredAt, ageMs, jobExists]
      properties:
        jobId: { type: string, nullable: true, description: 'Null when the bell could not be decoded.' }
        queue: { type: string }
        deliveryCount: { type: integer, nullable: true }
        deadLetteredAt: { type: integer, nullable: true }
        ageMs: { type: integer, nullable: true }
        jobExists: { type: boolean, description: 'The job still exists, so the job inspector can open it.' }
    DeadLettersResponse:
      type: object
      required: [ok, queue, available, reason, items, timestamp]
      properties:
        ok: { type: boolean, enum: [true] }
        queue: { type: string }
        available: { type: boolean }
        reason: { type: string, nullable: true, enum: [not_supported, unreachable, null] }
        items: { type: array, items: { $ref: '#/components/schemas/DeadLetterItem' } }
        timestamp: { type: integer }
    DeploymentWarning:
      type: object
      required: [code, severity, message]
      properties:
        code: { type: string, description: 'Stable: for example `tick_stale`, `tick_late`, `schema_ahead`, `doorbells_overdue`, `dev_token_enabled`.' }
        severity: { type: string, enum: [warning, critical] }
        message: { type: string }
    DeploymentResponse:
      type: object
      required: [ok, version, commit, production, devToken, schema, database, transport, connections, tick, workers, doorbells, warnings, timestamp]
      properties:
        ok: { type: boolean, enum: [true] }
        version: { type: string }
        commit: { type: string, nullable: true }
        production: { type: boolean }
        devToken: { type: boolean, description: 'Whether the development token is enabled; never its value.' }
        schema:
          type: object
          required: [current, expected, state]
          properties:
            current: { type: integer, nullable: true, description: 'The highest migration the database records.' }
            expected: { type: integer, description: 'The highest migration this build knows.' }
            state: { type: string, enum: [current, behind, ahead, unknown] }
        database:
          type: object
          required: [state, latencyMs]
          properties:
            state: { type: string, enum: [ok, failed, unknown] }
            latencyMs: { type: integer, nullable: true }
        transport:
          type: object
          required: [name, state]
          properties:
            name: { type: string }
            state: { type: string, enum: [ok, failed, unknown] }
        connections:
          type: object
          required: [inUse, maxConnections, needed, mode]
          properties:
            inUse: { type: integer, nullable: true }
            maxConnections: { type: integer, nullable: true }
            needed: { type: integer, nullable: true, description: 'What the declared fleet needs of the database; null when no fleet is declared.' }
            mode: { type: string, nullable: true, enum: [direct, pooled, null] }
        tick:
          type: object
          required: [state, lastSuccessAt, lastFailureAt, ageMs, lateAfterMs, staleAfterMs]
          properties:
            state: { type: string, enum: [ok, late, stale, never, unknown] }
            lastSuccessAt: { type: integer, nullable: true }
            lastFailureAt: { type: integer, nullable: true }
            ageMs: { type: integer, nullable: true }
            lateAfterMs: { type: integer, description: The age at which the tick is late (amber). }
            staleAfterMs: { type: integer, description: The age at which the tick is stale (red). }
        workers:
          type: object
          required: [total, active]
          properties:
            total: { type: integer, nullable: true }
            active: { type: integer, nullable: true }
        doorbells:
          type: object
          required: [notRung, oldestNotRungAgeMs, queuesScanned, partial]
          properties:
            notRung: { type: integer, nullable: true, description: 'Claimable jobs with no bell, over the queues scanned; null when not read.' }
            oldestNotRungAgeMs: { type: integer, nullable: true }
            queuesScanned: { type: integer, nullable: true }
            partial: { type: boolean, description: 'More queues have pending jobs than were scanned, or a count stopped at its cap.' }
        warnings: { type: array, items: { $ref: '#/components/schemas/DeploymentWarning' } }
        timestamp: { type: integer }
