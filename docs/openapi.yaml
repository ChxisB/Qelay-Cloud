        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /jobs/{id}/fail:
    post:
      tags: [unsupported]
      summary: 'Not supported: fail'
      description: 'Always 501 `not_supported` with `details.capability` `job-fail`. A failure is a worker''s report: it has no endpoint here.'
      operationId: jobFail
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '501': { $ref: '#/components/responses/NotSupported' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /jobs/{id}/discard:
    post:
      tags: [unsupported]
      summary: 'Not supported: discard'
      description: 'Always 501 `not_supported` with `details.capability` `job-discard`. Remove the job with `DELETE /jobs/{id}`.'
      operationId: jobDiscard
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '501': { $ref: '#/components/responses/NotSupported' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /jobs/{id}/move-to-wait:
    post:
      tags: [unsupported]
      summary: 'Not supported: move-to-wait'
      description: 'Always 501 `not_supported` with `details.capability` `job-retry`. A failed job is retried through the DLQ routes (task 32).'
      operationId: jobMoveToWait
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '501': { $ref: '#/components/responses/NotSupported' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /jobs/{id}/move-to-delayed:
    post:
      tags: [unsupported]
      summary: 'Not supported: move-to-delayed'
      description: 'Always 501 `not_supported` with `details.capability` `job-move-to-delayed`. Change a delayed job with `PUT /jobs/{id}/delay`.'
      operationId: jobMoveToDelayed
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '501': { $ref: '#/components/responses/NotSupported' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/dlq:
    get:
      tags: [dlq]
      summary: The failed jobs of a queue, with how each one failed
      description: |
        The dead-letter queue is the queue's failed jobs, oldest failure first. Each entry carries the job (its payload cut
        to the list budget, as in the job lists), when it entered, why, and its attempts. `expiresAt` is set when the queue
        has a `maxAge`. Paged by `limit` and `offset`; an `offset` past the walk limit is 400 `offset_too_large`, and
        `GET /queues/{queue}/jobs/list?states=failed&cursor=` walks further.
      operationId: listDlq
      parameters:
        - { $ref: '#/components/parameters/Queue' }
        - { name: limit, in: query, description: 'Default and maximum are the job lists'' page sizes.', schema: { type: integer, minimum: 1 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: One page of entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DlqList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/dlq/stats:
    get:
      tags: [dlq]
      summary: Counts of the dead-letter queue
      description: '`pendingRetry` and `expired` are always 0: nothing is retried by the service, and an entry past its `maxAge` is deleted by the tick.'
      operationId: getDlqStats
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DlqStatsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/dlq/purge:
    post:
      tags: [dlq]
      summary: Delete every entry of the dead-letter queue
      description: 'Needs `confirm` equal to the queue name and the operator role. Works in bounded transactions under a time budget: `done: false` means more is left and the call can be repeated. Jobs that other jobs wait on are not deleted by the store''s own rules.'
      operationId: purgeDlq
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmBody' }
      responses:
        '200':
          description: How many were removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionCount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/dlq/retry:
    post:
      tags: [unsupported]
      summary: 'Not supported: retry every DLQ entry'
      description: 'Always 501 `not_supported` with `details.capability` `dlq-retry`. Listed under `unsupported` by `GET /capabilities`, so a client leaves the control out.'
      operationId: retryDlq
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      responses:
        '501': { $ref: '#/components/responses/NotSupported' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/dlq/{jobId}/retry:
    post:
      tags: [unsupported]
      summary: 'Not supported: retry one DLQ entry'
      description: 'Always 501 `not_supported` with `details.capability` `dlq-retry`.'
      operationId: retryDlqJob
      parameters:
        - { $ref: '#/components/parameters/Queue' }
        - { name: jobId, in: path, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '501': { $ref: '#/components/responses/NotSupported' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/stall-config:
    get:
      tags: [queues]
      summary: Stall settings of a queue
      description: 'Only `maxStalls` is a setting. `enabled` is always true, `stallInterval` is the store''s lease length and `gracePeriod` is 0.'
      operationId: getStallConfig
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StallConfigResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
    put:
      tags: [queues]
      summary: Set how often a job may stall before it fails
      description: 'The body is the settings bare or wrapped as `{ "config": { ... } }`. A field that is sent back as read is accepted; one that differs from the fixed value is 400 `unsupported_option` naming it.'
      operationId: setStallConfig
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StallConfigBody' }
      responses:
        '200':
          description: The settings as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StallConfigResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/dlq-config:
    get:
      tags: [dlq]
      summary: Retention and auto-retry settings of the dead-letter queue
      description: '`autoRetry` is always false. `autoRetryInterval` and `maxAutoRetries` are fixed values, shown so the panel''s form renders.'
      operationId: getDlqConfig
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DlqConfigResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
    put:
      tags: [dlq]
      summary: Save the dead-letter queue's settings
      description: 'Retention and auto-retry are closed. A value equal to the current one is accepted (the form sends the whole object); a different `maxAge` or `maxEntries` is 501 `dlq-retention`, `autoRetry: true` is 501 `dlq-auto-retry`, and a different `autoRetryInterval` or `maxAutoRetries` is 400 `unsupported_option`.'
      operationId: setDlqConfig
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DlqConfigBody' }
      responses:
        '200':
          description: The settings as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DlqConfigResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '501': { $ref: '#/components/responses/NotSupported' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /flows:
    get:
      tags: [flows]
      summary: The flows of the namespace, newest first
      description: |
        A flow is a job with children, and its root is the job that has no parent. Each row counts the jobs of the flow that
        are stored now by state (a child removed when it completed is not counted) and says how many failed children hold a
        waiting parent back (`blocked`): a flow with `blocked > 0` is stuck until an operator acts. Paged by `limit` and
        `offset`; an `offset` past the walk limit is 400 `offset_too_large`.
      operationId: listFlows
      parameters:
        - { name: limit, in: query, description: 'Default and maximum are the job lists'' page sizes.', schema: { type: integer, minimum: 1 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: One page of flows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /flows/{id}:
    get:
      tags: [flows]
      summary: One flow as a list of jobs
      description: |
        The jobs of the flow whose root is `id`, top level first (every job comes after its parent), at most `limit` of them
        (default 1,000, at most 5,000). `truncated: true` says the flow has more jobs than are listed and `total` says how
        many; the failures listed are those of the jobs listed. Every job carries its `version`, which `POST
        /flows/{id}/actions` sends back. A child that completed and was removed is listed with `removed: true` and a null
        `version`. The read is not one snapshot: the versions are what fence an action to what was read.
      operationId: getFlow
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the root job of the flow.
          schema: { type: string, minLength: 1 }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000 } }
      responses:
        '200':
          description: The flow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /flows/{id}/actions:
    post:
      tags: [flows]
      summary: Retry the failed children of a flow, promote a stuck parent, or remove the flow
      description: |
        Needs the operator role, and is audited with the action named. The body names every job the action touches and the
        `version` it read it at, so the action is applied to the picture the caller saw or not at all, in one transaction:
        there is never a half-applied action.

        - `retry-failed`: each job named is a failed child that holds a waiting parent back; it is queued again with its
          attempts reset. A parent that never ran (it failed because a child failed under the `fail` policy) is not retried
          this way, because its children are not done.
        - `promote`: `parent` is a waiting parent; the failed children that hold it back are let go (their failures are
          kept for its processor as ignored) and it is queued. Refused while any other child has not finished.
        - `remove`: deletes every job of the flow, its edges, kept failures and logs. Needs `confirm` equal to the root id.
          Refused while a job of the flow is running.

        409 codes: `version_conflict` (a job moved since it was read), `flow_changed` (the flow has jobs the request did
        not name, or the request names jobs that do not apply or left the flow), `flow_active`, `flow_not_retryable`,
        `flow_not_stuck` (`details.reason`: `not_waiting`, `nothing_blocks`, `children_unfinished`) and `flow_too_large`.
        Nothing was changed in any of them.
      operationId: actOnFlow
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the root job of the flow.
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlowActionBody' }
      responses:
        '200':
          description: The action was applied; `changes` lists each job it changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowActionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /workflows:
    get:
      tags: [workflows]
      summary: The workflows of the namespace, and one page of their runs
      description: |
        Needs `features.workflows` in `GET /capabilities`. Per workflow: its runs counted by state, the definitions workers
        announced (`served` says a worker announced it within `QCLOUD_API_WORKFLOW_SERVED_MS`, default 120 s; `liveRuns` how
        many live runs are bound to its hash), and a warning for every definition hash that live runs are bound to while no
        worker serves it (`unserved_definition`): those runs cannot move until a worker with that definition runs or an
        operator cancels them. The runs are newest first, optionally of one workflow (`name`) or state, paged by `limit`
        and `offset`; `total` is how many match. The Control API holds no workflow definition: this is what the workers
        recorded.
      operationId: listWorkflows
      parameters:
        - { name: name, in: query, description: A workflow name., schema: { type: string, minLength: 1, maxLength: 512 } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/WorkflowState' } }
        - { name: limit, in: query, description: 'Default and maximum are the job lists'' page sizes.', schema: { type: integer, minimum: 1 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: The workflows and one page of runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /workflows/executions/{id}:
    get:
      tags: [workflows]
      summary: One workflow run
      description: |
        The run's state, its input, the signals it received, the result of the step that finished last (`output`), the
        definition it is bound to (null when no worker announced that hash, or it aged out), its child runs, how far its
        rollback got, `actions` (what `POST .../actions` would accept now) and a page of its steps. Every payload is cut to
        the job inspector's byte budgets (`input` and `output` to the detail budget, a step's result to the list budget,
        `GET .../steps?name=` to the detail budget) and what is cut is a `truncated` marker, with a `...Truncated` flag next
        to it. A step that fans out (a `forEach`, a `map`, a loop body) is one entry with `fanOut` counts; its iterations are
        read with `GET .../steps?iterationOf=`. **The panel shows these payloads to every `viewer`.** The run's `version` is
        what an action sends back as `expectedVersion`.
      operationId: getWorkflowExecution
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { name: limit, in: query, description: Steps per page., schema: { type: integer, minimum: 1 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /workflows/executions/{id}/steps:
    get:
      tags: [workflows]
      summary: The steps of a run, a page at a time
      description: |
        Without a selector: the steps in the order they started, a fan-out once. `iterationOf` lists the iterations of one
        fan-out step in order (a 10,000-item `forEach` is read 100 at a time); `name` reads that one record with the detail
        payload budget; `status` filters either. A selector that matches nothing is an empty page.
      operationId: listWorkflowSteps
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { name: iterationOf, in: query, schema: { type: string, minLength: 1, maxLength: 512 } }
        - { name: name, in: query, schema: { type: string, minLength: 1, maxLength: 512 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, running, completed, failed] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: One page of steps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowStepsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /workflows/executions/{id}/actions:
    post:
      tags: [workflows]
      summary: Signal, cancel, recover or unblock the rollback of a run
      description: |
        Needs the operator role, and is audited with the action and the run named, never an event, a payload or a reason.
        The Control API runs no engine, so an action is a claim and a publish: a version-checked write of the run, then a
        `wf:step` job on the engine queue for a worker that holds the definition to execute. `expectedVersion` is the
        run's `version` as read: a run that moved since is 409 `version_conflict` and nothing changes, and a finished run is
        409 `execution_terminal`.

        - `signal`: records `event` (with `payload`, in the tagged form of the job routes) for the run's `waitFor`. A parked
          run is resumed; a running one keeps it for its gate. An event is kept once: a second one is 409 `signal_rejected`.
          For `signal`, `retry-compensation` and `abandon-compensation` the store or the worker claims inside the call,
          so `expectedVersion` is a read check and not a lock held through the publish.
        - `cancel`: stops a `running` or `waiting` run and rolls it back; `reason` is kept as its failure reason. Needs
          `confirm` equal to the run id. A node that is executing finishes its handler, then its next write loses against
          the claim and it stands down.
        - `recover`: publishes the run's node (or its owed rollback) again, for a run whose job or worker was lost; also a
          parked run whose awaited signal is recorded but whose resume was never published. Only once the run has shown no
          progress for `QCLOUD_WORKFLOW_IDLE_MS` (the tick's own setting): earlier it is 409 `workflow_progressing`.
        - `retry-compensation`: for a run in `compensation-stuck`, retries the failed reversal.
        - `abandon-compensation`: for a run in `compensation-stuck`, records the remaining reversals as skipped and settles
          the run. Needs `confirm` equal to the run id.

        409 codes: `version_conflict`, `execution_terminal`, `execution_state` (the action does not apply to the run's
        state; `details.allowed` lists what does), `workflow_progressing`, `signal_rejected`. 503 `publish_failed`
        says whether the run had already been changed (`details.claimed`).
      operationId: actOnWorkflowExecution
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowActionBody' }
      responses:
        '200':
          description: The action was applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowActionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/PublishFailed' }
        '504': { $ref: '#/components/responses/Timeout' }
  /crons:
    get:
      tags: [cron]
      summary: Every cron
      description: At most 1000 are returned; `total` is how many exist and `truncated` says when there were more. A cron's `data` is not returned.
      operationId: listCrons
      responses:
        '200':
          description: The crons.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CronList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
    post:
      tags: [cron]
      summary: Create or replace a cron
      description: |
        One upsert by `name`: 201 for a new cron, 200 for a replaced one. Exactly one of `schedule` (a cron expression)
        and `repeatEvery` (milliseconds) is required. An unchanged timing keeps `nextRun` and `executions`; changed timing
        is computed from now. A missed occurrence is never made up, so `skipMissedOnRestart: false` is 400
        `unsupported_option`. A bad expression, an unknown time zone or an unknown template key is 400
        `unsupported_option` with `details.option`. Nothing is written on a 400.
      operationId: createCron
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CronBody' }
      responses:
        '200':
          description: An existing cron was replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CronEnvelope' }
        '201':
          description: A new cron.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CronEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /crons/{name}:
    get:
      tags: [cron]
      summary: One cron
      operationId: getCron
      parameters:
        - { $ref: '#/components/parameters/CronName' }
      responses:
        '200':
          description: The cron.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CronEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
    put:
      tags: [cron]
      summary: Create or replace the cron of this name
      description: 'Same as `POST /crons`, with the name from the path; a `name` in the body that differs is 400. Always 200.'
      operationId: replaceCron
      parameters:
        - { $ref: '#/components/parameters/CronName' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CronBody' }
      responses:
        '200':
          description: The cron as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CronEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
    delete:
      tags: [cron]
      summary: Delete a cron
      description: Stops the next occurrences. Jobs it already created stay.
      operationId: deleteCron
      parameters:
        - { $ref: '#/components/parameters/CronName' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /workers:
    get:
      tags: [workers]
      summary: The worker registry
      description: Every registered worker, `stale` ones included until the tick deletes them.
      operationId: listWorkers
      responses:
        '200':
          description: The workers and their counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkersList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /workers/{id}:
    delete:
      tags: [workers]
      summary: Remove a worker from the registry
      description: 'Removes the row. A worker that is still running registers again on its next heartbeat, and a job it holds is recovered by its lease. A worker that is already gone is not an error: `removed` is false.'
      operationId: removeWorker
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: Whether a row was removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerRemoved' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /webhooks:
    get:
      tags: [webhooks]
      summary: The registered webhooks
      description: |
        Every webhook with its counters. A `viewer` sees each address as its origin only (`urlRedacted: true`), because a
        receiver's token is often in the path or query; an `operator` sees the whole URL. The signing secret is in no
        response: `signed` says whether there is one.
      operationId: listWebhooks
      responses:
        '200':
          description: The webhooks and their counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhooksList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
    post:
      tags: [webhooks]
      summary: Register a webhook
      description: |
        Registers an address for the events listed, optionally for one queue. The address is checked against the
        deployment's policy (https only, and no loopback, private, link-local or metadata destination, unless the
        deployment runs in development mode): a refusal is 400 with the rule as `error.code` (`invalid_url`,
        `scheme_not_allowed`, `credentials_not_allowed`, `host_not_allowed`). The name is not resolved here; the sender
        checks what it resolves to at every attempt. A `secret` (16 to 256 characters) signs each delivery
        (`docs/webhooks.md`) and needs the deployment's `QCLOUD_WEBHOOK_KEY` (409 `webhook_key_missing` without it);
        it is never returned. At most 100 webhooks (409 `webhook_limit`).
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookCreate' }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /webhooks/{id}:
    get:
      tags: [webhooks]
      summary: One webhook
      operationId: getWebhook
      parameters:
        - { $ref: '#/components/parameters/WebhookId' }
      responses:
        '200':
          description: The webhook.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
    delete:
      tags: [webhooks]
      summary: Delete a webhook
      description: Its deliveries and their history go with it, and nothing more is sent for it.
      operationId: deleteWebhook
      parameters:
        - { $ref: '#/components/parameters/WebhookId' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /webhooks/{id}/enabled:
    put:
      tags: [webhooks]
      summary: Enable or disable a webhook
      description: A disabled webhook gets no new deliveries. Those already queued are still sent.
      operationId: setWebhookEnabled
      parameters:
        - { $ref: '#/components/parameters/WebhookId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: The webhook after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /webhooks/{id}/test:
    post:
      tags: [webhooks]
      summary: Queue a test event
      description: |
        Queues one `webhook.test` delivery, whatever events the webhook listens for. It is sent by the next maintenance
        tick with the webhook's usual retry policy, so the answer is 202 with a `pending` delivery; read
        `GET /webhooks/{id}/deliveries` for what became of it. A disabled webhook is 409 `webhook_disabled`.
      operationId: testWebhook
      parameters:
        - { $ref: '#/components/parameters/WebhookId' }
      responses:
        '202':
          description: The queued delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /webhooks/{id}/deliveries:
    get:
      tags: [webhooks]
      summary: The delivery history of a webhook
      description: |
        Newest first, `limit` (default 50, at most 200) at a time. `next` is the `before` of the following page and null on
        the last one. A delivery carries its status, the attempts made and, per attempt, the receiver's status and a short
        reason in words. It never carries the address, the secret, a response body or a resolved IP. Finished
        deliveries are kept 7 days.
      operationId: listWebhookDeliveries
      parameters:
        - { $ref: '#/components/parameters/WebhookId' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, description: 'The `next` of the previous page.', schema: { type: string, pattern: '^[1-9][0-9]{0,15}$' } }
        - { name: status, in: query, schema: { type: string, enum: [pending, sending, delivered, failed] } }
      responses:
        '200':
          description: One page of the history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveriesPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /webhooks/{id}/deliveries/{deliveryId}/retry:
    post:
      tags: [webhooks]
      summary: Retry a failed delivery
      description: |
        Puts a `failed` delivery back in the queue with a fresh attempt budget; the attempt numbers keep rising and its
        history is kept. Any other status is 409 `delivery_not_failed` with `details.status`.
      operationId: retryWebhookDelivery
      parameters:
        - { $ref: '#/components/parameters/WebhookId' }
        - { name: deliveryId, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]{0,15}$' } }
      responses:
        '200':
          description: The delivery, pending again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /events:
    get:
      tags: [events]
      summary: Live job events of every queue (server-sent events)
      description: |
        A `text/event-stream`. The first frame is `retry: 2000`, an `id` and `{"connected":true}`. Each later frame has the
        journal position after it as `id` (`<commitSeq>.<eventId>`) and an `event` of `job:<type>` or `queue:obliterated`;
        its `data` is `{queue, jobId, type, state, timestamp, error?, progress?, removed?}`, a hint that something changed
        and not the job. A client that reconnects sends the last `id` as `Last-Event-ID` (the header wins over `?cursor=`)
        and continues without a gap or a repeat. `event: resync` says the journal lost events the client had not read:
        reload the lists. `: keep-alive` comments are sent every `heartbeatMs` (default 15 s). The stream ends cleanly
        after `maxLifetimeMs` (default 10 min) with a closing comment, and a client that stops reading is disconnected
        after `slowClientMs` (default 30 s); both reconnect from the last `id`. A position that is not one this service
        issued is 400 `invalid_cursor`, and one past the end of the journal is 409 `cursor_ahead` (drop it and start
        live). Without a position the stream starts at the journal's end. At most `maxPerPrincipal` (10) streams per
        principal (429) and `maxStreams` (200) per instance (503) are open.
      operationId: streamEvents
      parameters:
        - { name: queue, in: query, schema: { type: string, minLength: 1, maxLength: 256 } }
        - { $ref: '#/components/parameters/EventTypes' }
        - { $ref: '#/components/parameters/EventCursor' }
        - { name: Last-Event-ID, in: header, description: 'The `id` of the last frame received.', schema: { type: string } }
      responses:
        '200':
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyStreams' }
        '503': { $ref: '#/components/responses/TooManyStreams' }
  /events/queues/{queue}:
    get:
      tags: [events]
      summary: Live job events of one queue (server-sent events)
      description: 'The same stream as `GET /events`, for the queue in the path; a `queue` in the query that differs is 400.'
      operationId: streamQueueEvents
      parameters:
        - { $ref: '#/components/parameters/Queue' }
        - { $ref: '#/components/parameters/EventTypes' }
        - { $ref: '#/components/parameters/EventCursor' }
        - { name: Last-Event-ID, in: header, description: 'The `id` of the last frame received.', schema: { type: string } }
      responses:
        '200':
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyStreams' }
        '503': { $ref: '#/components/responses/TooManyStreams' }
  /metrics:
    get:
      tags: [metrics]
      summary: The four counters of the namespace
      description: Read as the dashboard is, from the same per-instance cache (`X-Qelay-Cache` applies).
      operationId: getMetrics
      responses:
        '200':
          description: The counters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsTotals' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '504': { $ref: '#/components/responses/Timeout' }
  /metrics/queues/{queue}:
    get:
      tags: [metrics]
      summary: Jobs completed and failed over time
      description: |
        One point per `resolution` minutes (1, 5, 15 or 60), oldest first, dense (zero where nothing finished); each
        `timestamp` is the start of its window. `minutes` back from `until` (default now), at most the configured range
        (400 `range_too_large`). Latency and wait-time percentiles are not recorded and are not in the response.
      operationId: getQueueMetrics
      parameters:
        - { $ref: '#/components/parameters/Queue' }
        - { name: minutes, in: query, description: Default 60., schema: { type: integer, minimum: 1 } }
        - { name: resolution, in: query, description: Default 1., schema: { type: integer, enum: [1, 5, 15, 60] } }
        - { name: until, in: query, description: Epoch milliseconds; default now., schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: The series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsSeries' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /audit:
    get:
      tags: [audit]
      summary: The operator audit log
      description: |
        Newest first; `next` goes back as `before` for the next page. An entry says who did what to which identifiers and
        how it ended (`pending`, `success`, `rejected` with a `reason`, `failed`), and never a body or a payload. Needs the
        `operator` role even though it only reads. Answers 501 `not_implemented` when no audit log is configured.
      operationId: listAudit
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
        - { name: before, in: query, description: 'The previous page''s `next`.', schema: { type: integer, minimum: 1 } }
        - { name: subject, in: query, schema: { type: string, minLength: 1, maxLength: 256 } }
        - { name: action, in: query, description: 'For example `POST /queues/:queue/pause`.', schema: { type: string, minLength: 1, maxLength: 160 } }
        - { name: outcome, in: query, schema: { type: string, enum: [pending, success, rejected, failed] } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '504': { $ref: '#/components/responses/Timeout' }
  /transport:
    get:
      tags: [transport]
      summary: The doorbell path, queue by queue
      description: |
        Per queue: the broker's numbers (bells waiting, the age of the oldest undelivered bell, the dead-letter queue's depth
        and the age of its oldest bell, each with a `freshness`) next to the store's (`claimable` jobs, jobs with no bell
        `notRung`, jobs due a re-ring). `null` is "unknown": the number could not be read, which is not zero. A cloud
        broker's metrics lag by minutes, so read a number with its `freshness.ageMs`, never as real time. Queues with pending
        jobs come first, and at most `deployment.maxQueues` (default 50) are covered (`truncated`). The plain call is kept
        for `deployment.cacheMs` (default 2 s) per instance; `X-Qelay-Cache: bypass` reads fresh. Answers 501
        `not_implemented` when this build has no store.
      operationId: getTransport
      responses:
        '200':
          description: The transport and its queues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '504': { $ref: '#/components/responses/Timeout' }
  /transport/dead-letters:
    get:
      tags: [transport]
      summary: A sample of the poison doorbells of one queue
      description: |
        Bells the broker gave up delivering, read without being consumed and given back at once: a sample of at most `limit`,
        not a count and not an order. Needs the `operator` role, because it pulls from the broker and names job ids. It never
        redrives anything: redrive is a manual runbook step. `available: false` says why in `reason` (`not_supported` when
        the transport has no dead-letter queue, `unreachable` when the broker could not be read), and then `items` is empty
        and means nothing.
      operationId: getTransportDeadLetters
      parameters:
        - { name: queue, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 256 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: The sample.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadLettersResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '504': { $ref: '#/components/responses/Timeout' }
  /deployment:
    get:
      tags: [deployment]
      summary: What is deployed, and whether it is keeping up
      description: |
        The build, the schema the database records against the one this build expects, the database's round trip, the
        connections in use against the cap (and the declared fleet's need, from `budget()`), the last successful tick and its
        age against the `late` and `stale` thresholds, the workers, the doorbells nobody has rung, and the `warnings` an
        operator should read first. A reading that could not be taken is `null`, shown as unknown, never as zero. It holds no
        secret: no connection string, token or credential, only whether the development token is enabled. It is read-only and
        works when the database is down (then `database.state` is `failed`). Kept for `deployment.cacheMs` per instance;
        `X-Qelay-Cache: bypass` reads fresh.
      operationId: getDeployment
      responses:
        '200':
          description: The deployment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
