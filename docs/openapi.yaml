openapi: 3.0.3
info:
  title: Qelay-Cloud Control API
  version: 0.1.0
  description: |
    The HTTP API behind the Qelay control panel. This file documents only what exists: the core routes of task 30
    (health, capabilities), the jobs and queues routes of task 31 (dashboard, stats, queues, jobs, and the 501
    surfaces) and the operator routes of task 32 (DLQ, stall and DLQ settings, crons, workers, the event stream,
    metrics, the audit log and the server-status calls), the flow routes of task 51, the webhook routes of task 52 and the
    workflow routes of task 62. A test (`packages/control-api/test/openapi.test.ts`) fails when a route is served
    and not documented here, or documented and not served.

    Routes that change something need the `operator` role; a `viewer` token gets 403. A job's `version` is what an
    action sends back as `expectedVersion`: a stale one is 409 `version_conflict` and nothing changes. Payloads
    (`data`, `returnvalue`) are JSON with tagged values for what JSON has no type for: `{"$type":"bigint","value":"1"}`,
    `date`, `bytes`, `map`, `set`, `number` (`-0`, `NaN`, `Infinity`) and `undefined`. A payload over the response's
    budget is `{"$type":"truncated","kind":"string","length":...,"preview":"...","maxBytes":...}` and the job says
    `truncated: true`.

    Every operation that changes something is written to the operator audit log (`GET /audit`) before it runs, and
    closed with its outcome after: a refusal (role, rate limit, validation, a 4xx from the handler) is a row too, and a
    row never holds a body or a payload. When the log cannot be written the operation does not run (503
    `audit_unavailable`).

    Authentication is a bearer token in the `Authorization` header and nothing else: no cookies are read or set, so
    CSRF does not apply. `GET /health` is the only route without a token. Timestamps are epoch milliseconds.
servers:
  - url: http://127.0.0.1:8080
    description: Default listen address (`QCLOUD_API_HOST`, `QCLOUD_API_PORT`).
security:
  - bearer: []
tags:
  - name: health
  - name: capabilities
  - name: dashboard
  - name: queues
  - name: jobs
  - name: dlq
  - name: flows
  - name: workflows
  - name: cron
  - name: webhooks
  - name: workers
  - name: events
  - name: metrics
  - name: audit
  - name: transport
  - name: deployment
  - name: unsupported
    description: Qelay features with no meaning on a managed queue. Always 501 `not_supported`.
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness
      description: Answers from memory and touches nothing. Says nothing about the database or the jobs.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /health/ready:
    get:
      tags: [health]
      summary: Readiness
      description: |
        Ready when the database answers a trivial query within 3 s and has every migration this build needs
        (`checks.schema.state` is not `behind`). The transport and the tick are reported and do not make the service
        unready. Carries no job data.
      operationId: getReady
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: The database is unavailable, or lacks a migration this build needs. The body has `storage.error`, which the panel reads.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /ready:
    get:
      tags: [health]
      summary: Readiness (alias)
      description: Same as `GET /health/ready`. It is the path the panel's diagnostics page probes today.
      operationId: getReadyAlias
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: The database is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /capabilities:
    get:
      tags: [capabilities]
      summary: What this deployment runs and what the panel should show
      description: |
        The transport and the feature flags are declared by the process that built the service, so the answer is the
        configuration. `hidden` lists panel pages that only make sense for a Qelay TCP server or a local control agent.
      operationId: getCapabilities
      responses:
        '200':
          description: The declared transport and features.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /dashboard:
    get:
      tags: [dashboard]
      summary: Overview for the panel's home page
      description: |
        Totals of the namespace, read as one aggregate over the jobs' state indexes and kept for
        `jobs.options.summaryCacheMs` (default 2 s) per instance; `X-Qelay-Cache: bypass` reads fresh. Throughput rates
        are deltas of the journal between two reads (0 on the first). Answers 501 `not_implemented` when the process was
        built without a store.
      operationId: getDashboard
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /stats:
    get:
      tags: [dashboard]
      summary: Counts and rates
      description: The same reads as `GET /dashboard`, with the extra counts and memory fields the statistics page shows.
      operationId: getStats
      responses:
        '200':
          description: The statistics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /queues/summary:
    get:
      tags: [queues]
      summary: Every queue with its counts
      description: 'A bare array, as the panel reads it. At most 1,000 queues come back; when more follow, the `X-Next-Cursor` response header holds the value to pass as `after`. The plain call is kept for `jobs.options.summaryCacheMs` (default 2 s) per instance; `X-Qelay-Cache: bypass` reads fresh.'
      operationId: getQueuesSummary
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { name: after, in: query, description: The `X-Next-Cursor` of the previous page., schema: { type: string, maxLength: 256 } }
      responses:
        '200':
          description: 'The queues, by name.'
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/QueueSummaryRow' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/counts:
    get:
      tags: [queues]
      summary: Jobs of a queue by state
      description: '`paused` is the number of jobs a pause holds back (`waiting` plus `prioritized` while the queue is paused, else 0).'
      operationId: getQueueCounts
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueCountsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/paused:
    get:
      tags: [queues]
      summary: Whether a queue is paused
      operationId: getQueuePaused
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      responses:
        '200':
          description: The flag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuePausedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /dashboard/queues:
    get:
      tags: [dashboard]
      summary: Queues as the dashboard lists them
      description: '`waiting` excludes prioritized jobs and `dlq` is the number of failed jobs. `offset` beyond 10,000 is 400 `offset_too_large`.'
      operationId: getDashboardQueues
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000 } }
      responses:
        '200':
          description: A page of queues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardQueues' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /dashboard/queues/{queue}:
    get:
      tags: [dashboard]
      summary: One queue as the queue page reads it
      description: 'Counts, priority counts, a preview of the failed jobs and, unless `includeJobs=false`, up to 20 jobs of each list.'
      operationId: getDashboardQueue
      parameters:
        - { $ref: '#/components/parameters/Queue' }
        - { name: includeJobs, in: query, schema: { type: string, enum: ['true', 'false'], default: 'true' } }
      responses:
        '200':
          description: The queue page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/jobs/list:
    get:
      tags: [jobs]
      summary: Jobs of a queue, one page
      description: 'Offset paging up to 100,000 and a keyset `cursor` beyond it. A page is 50 jobs by default and 500 at most. A payload over the list budget is replaced by a `truncated` marker and the job says `truncated: true`; the job page has it whole up to its own, larger, budget.'
      operationId: listQueueJobs
      parameters:
        - { $ref: '#/components/parameters/Queue' }
        - { name: states, in: query, description: Comma separated job states; default every state., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: cursor, in: query, description: The `next` of the previous page; replaces `offset`., schema: { type: string } }
      responses:
        '200':
          description: A page of jobs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobsList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/jobs:
    post:
      tags: [jobs]
      summary: Add one job
      description: 'The job goes through the same producer path as the SDK, so its bell is rung after the commit. Options this service has no equivalent for (`ttl`, `repeat`, `dependsOn`, `tags`, `durable: false`, numeric retention) are 400 `unsupported_option` naming the option. A `jobId` that is already live answers that job with `duplicated: true`.'
      operationId: addJob
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddJobBody' }
      responses:
        '200':
          description: 'The job, new or the live duplicate.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddedJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/jobs/bulk:
    post:
      tags: [jobs]
      summary: Add up to 10,000 jobs
      description: 'All or none: one invalid job refuses the call and `details.index` says which. The ids come back in the order of the request.'
      operationId: addJobsBulk
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkAddBody' }
      responses:
        '200':
          description: 'The ids, and the indexes that were duplicates.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddedJobs' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/pause:
    post:
      tags: [queues]
      summary: Pause a queue
      operationId: pauseQueue
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      responses:
        '200':
          description: Paused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/resume:
    post:
      tags: [queues]
      summary: Resume a queue
      operationId: resumeQueue
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      responses:
        '200':
          description: Resumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/drain:
    post:
      tags: [queues]
      summary: Delete the jobs that have not run
      description: 'Needs `confirm` equal to the queue name and the operator role. Active and finished jobs stay. A call is bounded by a time budget: `done: false` means more is left and the call can be repeated.'
      operationId: drainQueue
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmBody' }
      responses:
        '200':
          description: How many were removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionCount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/clean:
    post:
      tags: [queues]
      summary: Delete finished jobs older than a grace period
      description: 'Needs `confirm` equal to the queue name and the operator role. `done: false` means more is left.'
      operationId: cleanQueue
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleanBody' }
      responses:
        '200':
          description: How many were removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionCount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/obliterate:
    post:
      tags: [queues]
      summary: Delete a queue and all its jobs
      description: 'Needs `confirm` equal to the queue name and the operator role. A queue with an active job is 409 `job_state` unless `force` is true.'
      operationId: obliterateQueue
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObliterateBody' }
      responses:
        '200':
          description: How many were removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionCount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/promote-jobs:
    post:
      tags: [queues]
      summary: Make delayed jobs due now
      operationId: promoteQueueJobs
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoteJobsBody' }
      responses:
        '200':
          description: How many were promoted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionCount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/rate-limit:
    put:
      tags: [queues]
      summary: Limit how many jobs start per window
      operationId: setQueueRateLimit
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateLimitBody' }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
    delete:
      tags: [queues]
      summary: Lift the rate limit
      operationId: clearQueueRateLimit
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      responses:
        '200':
          description: Lifted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /queues/{queue}/concurrency:
    put:
      tags: [queues]
      summary: Limit active jobs of a queue
      operationId: setQueueConcurrency
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConcurrencyBody' }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
    delete:
      tags: [queues]
      summary: Lift the concurrency limit
      operationId: clearQueueConcurrency
      parameters:
        - { $ref: '#/components/parameters/Queue' }
      responses:
        '200':
          description: Lifted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /jobs/{id}:
    get:
      tags: [jobs]
      summary: One job in full
      description: 'A job''s id is its custom id when it has one. `version` is what an action sends back as `expectedVersion`.'
      operationId: getJob
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
    delete:
      tags: [jobs]
      summary: Remove a job
      description: 'Not an active job (409 `job_state`) and not a flow parent (409 `flow_protected`). `expectedVersion` fences the removal to the job as it was read.'
      operationId: removeJob
      parameters:
        - { $ref: '#/components/parameters/JobId' }
        - { $ref: '#/components/parameters/ExpectedVersionQuery' }
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /jobs/custom/{customId}:
    get:
      tags: [jobs]
      summary: One job by its custom id
      description: 'The same lookup as `GET /jobs/{id}`: a custom id is the job''s id.'
      operationId: getJobByCustomId
      parameters:
        - { $ref: '#/components/parameters/CustomId' }
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /jobs/{id}/result:
    get:
      tags: [jobs]
      summary: The return value of a job
      operationId: getJobResult
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '200':
          description: 'The result, or null.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /jobs/{id}/logs:
    get:
      tags: [jobs]
      summary: Log lines of a job
      operationId: getJobLogs
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '200':
          description: The lines.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobLogs' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
    post:
      tags: [jobs]
      summary: Add a log line
      operationId: addJobLog
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogBody' }
      responses:
        '200':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
    delete:
      tags: [jobs]
      summary: Delete the log lines of a job
      operationId: clearJobLogs
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '200':
          description: How many were removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogsCleared' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /jobs/{id}/children:
    get:
      tags: [jobs]
      summary: Children of a flow job
      description: 'What the completed children of a flow parent returned, by `"<queue>:<id>"`; an empty map for a job that is not a parent. Each value is cut to the list payload budget (`truncated: true` says one was).'
      operationId: getJobChildren
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '200':
          description: The children.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobChildren' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '504': { $ref: '#/components/responses/Timeout' }
  /jobs/{id}/data:
    put:
      tags: [jobs]
      summary: Replace the data of a job
      description: 'A finished job is 409 `job_state`. `expectedVersion` fences the change; a stale one is 409 `version_conflict` and nothing changes.'
      operationId: updateJobData
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataBody' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /jobs/{id}/priority:
    put:
      tags: [jobs]
      summary: Change the priority of a waiting job
      description: 'An active or finished job is 409 `job_state`. `lifo` is accepted only when it equals the job''s own; otherwise 501 `not_supported` (`lifo`).'
      operationId: updateJobPriority
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriorityBody' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotSupported' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '504': { $ref: '#/components/responses/Timeout' }
  /jobs/{id}/delay:
    put:
      tags: [jobs]
      summary: Change when a delayed job is due
      description: 'Only a delayed job: any other is 409 `job_state`. A delay of 0 makes it due and rings it.'
      operationId: updateJobDelay
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      requestBody:
        required: true
