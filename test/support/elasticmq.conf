# ElasticMQ for the SQS transport's tests (packages/transport-aws). Local only: queue URLs embed node-address, so it must match the
# published host port (127.0.0.1:59324 -> 9324 in the container). `sqs-limits = strict` makes the
# emulator enforce SQS's documented limits (delay, batch size, message size) instead of ignoring them.
include classpath("application.conf")

node-address {
  protocol = http
  host = "127.0.0.1"
  port = 59324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = false
}
