; PgBouncer in transaction mode, a stand-in for a managed transaction-mode pooler (Cloud SQL managed
; connection pooling is PgBouncer-based; RDS Proxy is not, so it is only a partial stand-in there).
; Local test use only: loopback port, throwaway credentials, no TLS.
[databases]
; Pass-through: the client's own startup parameters must be accepted by the pooler.
qcloud_test = host=postgres port=5432 dbname=qcloud_test
; Session state set once per server connection, as an RDS Proxy "initialization query" would.
; The schema is fixed because a pooler cannot take a per-client search_path.
qcloud_pooled = host=postgres port=5432 dbname=qcloud_test connect_query='SET search_path = qcloud_pool_spike; SET statement_timeout = 30000; SET lock_timeout = 5000; SET idle_in_transaction_session_timeout = 30000'

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = qcloud
pool_mode = transaction
default_pool_size = 10
max_client_conn = 400
max_prepared_statements = 0
